<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر يومك</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
        }

        /* Top Bar Responsive */
        .top-bar {
            padding: 15px 5% 0 5%;
            background-color: #ffffff;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #000;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid #e0e0e0;
            padding: 6px 14px;
            border-radius: 20px;
            transition: 0.2s;
        }

        .social-link:hover {
            background-color: #000;
            color: #fff;
            border-color: #000;
        }

        .social-link.whatsapp:hover {
            background-color: #25D366;
            color: #fff;
            border-color: #25D366;
        }

        /* Centered Header */
        .brand-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 15px 5% 20px 5%;
            border-bottom: 1px solid #eeeeee;
        }

        .brand-logo {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1;
        }

        .brand-info {
            text-align: right;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .brand-sub {
            font-size: 0.85rem;
            color: #777;
            margin-top: 3px;
        }

        /* Main Container & Grid Responsive */
        .container {
            padding: 25px 5%;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: right;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .product-card {
            border: 1px solid #efefef;
            border-radius: 8px;
            padding: 12px;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .image-container {
            width: 100%;
            height: 150px;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
            background-color: #f0f0f0;
            cursor: pointer;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s;
        }

        .image-container:hover img {
            transform: scale(1.03);
        }

        .product-title {
            font-size: 0.85rem;
            color: #222;
            margin-bottom: 6px;
            text-align: right;
            font-weight: 500;
        }

        .product-price {
            font-size: 0.95rem;
            font-weight: 700;
            color: #000;
            margin-bottom: 12px;
            text-align: right;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-action {
            width: 100%;
            padding: 9px 0;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            border: 1px solid #000;
            background-color: #ffffff;
            color: #000;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
            display: block;
            transition: 0.2s;
        }

        .btn-action:hover {
            background-color: #000;
            color: #fff;
        }

        .btn-action.btn-whatsapp {
            border-color: #25D366;
            color: #25D366;
        }

        .btn-action.btn-whatsapp:hover {
            background-color: #25D366;
            color: #fff;
        }

        /* Modal Gallery Responsive */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.88);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 95%;
            max-height: 65vh;
            border-radius: 8px;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #fff;
            font-size: 2.2rem;
            cursor: pointer;
        }

        .thumbnails {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            overflow-x: auto;
            max-width: 100%;
            padding: 5px 0;
        }

        .thumb {
            width: 55px;
            height: 55px;
            border-radius: 6px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.6;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .thumb.active, .thumb:hover {
            border-color: #fff;
            opacity: 1;
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            .brand-logo {
                font-size: 2.8rem;
            }
            .brand-name {
                font-size: 1.3rem;
            }
            .product-grid {
                grid-template-columns: 1fr;
            }
            .image-container {
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <a href="https://tiktok.com/@mtjryomk" target="_blank" class="social-link">
            <i class="fab fa-tiktok"></i> تابعنا
        </a>
        <a href="https://wa.me/966560983152" target="_blank" class="social-link whatsapp">
            <i class="fab fa-whatsapp"></i> الواتساب
        </a>
    </div>

    <!-- Centered Header -->
    <div class="brand-section">
        <div class="brand-logo">YD</div>
        <div class="brand-info">
            <div class="brand-name">متجر يومك</div>
            <div class="brand-sub">متجر الكترونيات</div>
        </div>
    </div> 

    <!-- Main Content -->
    <div class="container">
        <div class="section-title">أحدث المنتجات</div>
        <div class="product-grid">
            <div class="product-card">
                <div class="image-container" onclick="openGallery(0)">
                    <img src="rbx2018.1.png" alt="حزمة روبلوكس 2018">
                </div>
                <div class="product-title">حزمة روبلوكس 2018</div>
                <div class="product-price">2.99 ريال</div>
                <div class="btn-group">
                    <a href="https://www.paypal.com/paypalme/yourdaystore/0.80USD" target="_blank" class="btn-action">دفع عبر PayPal</a>
                    <a href="https://wa.me/966560983152?text=%D8%A3%D8%B1%D9%8A%D8%AF%20%D8%B4%D8%B1%D8%A7%D8%A1%20%D8%AD%D8%B2%D9%85%D8%A9%20%D8%B1%D9%88%D8%A8%D9%84%D9%88%D9%83%D8%B3%202018" target="_blank" class="btn-action btn-whatsapp">طلب عبر الواتساب</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Gallery Modal -->
    <div class="modal" id="galleryModal">
        <span class="modal-close" onclick="closeGallery()">&times;</span>
        <img class="modal-content" id="mainModalImg" src="" alt="صورة المنتج">
        <div class="thumbnails" id="thumbContainer"></div>
    </div>

    <script>
        const images = ["rbx2018.1.png", "rbx2018.2.png", "rbx2018.3.png"];

        function openGallery(startIndex) {
            const modal = document.getElementById('galleryModal');
            const thumbContainer = document.getElementById('thumbContainer');
            
            thumbContainer.innerHTML = '';
            images.forEach((imgSrc, index) => {
                const thumb = document.createElement('img');
                thumb.src = imgSrc;
                thumb.className = 'thumb' + (index === startIndex ? ' active' : '');
                thumb.onclick = () => setImage(index);
                thumbContainer.appendChild(thumb);
            });

            setImage(startIndex);
            modal.classList.add('active');
        }

        function setImage(index) {
            document.getElementById('mainModalImg').src = images[index];
            const thumbs = document.querySelectorAll('.thumb');
            thumbs.forEach((t, i) => {
                t.classList.toggle('active', i === index);
            });
        }

        function closeGallery() {
            document.getElementById('galleryModal').classList.remove('active');
        }
    </script>

</body>
</html>
