<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الإلكتروني</title>
    <!-- PayPal JavaScript SDK v6 -->
    <script src="https://www.paypal.com/sdk/js?client-id=BAAbkeyKDVPNIjjWP5xGUTglCqhp141nIbP9Y73InRwzgU_GuscYVf-B6gp7G0QhLDH5ZkK4x86c_AXJuw&currency=USD&intent=capture&enable-funding=venmo,paylater"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #fafafa;
            color: #1c1c1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #2c2c2e;
        }

        .container {
            width: 100%;
            max-width: 960px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        /* كروت المنتجات بأبيض خافت وظلال ناعمة */
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #f0f0f2;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: box-shadow 0.2s ease;
        }

        .card:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .card-img {
            width: 100%;
            height: 160px;
            background: #f4f4f6;
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card-price {
            font-size: 15px;
            color: #636366;
            margin-bottom: 20px;
        }

        .paypal-box {
            min-height: 100px;
        }

        /* تذييل الواتساب */
        footer {
            margin-top: auto;
            text-align: center;
        }

        .whatsapp-btn {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            border: 1px solid #e5e5ea;
            padding: 14px 28px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .whatsapp-btn:hover {
            border-color: #25d366;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.12);
        }

        .whatsapp-btn span {
            font-size: 12px;
            color: #8e8e93;
            margin-bottom: 4px;
        }

        .whatsapp-btn strong {
            font-size: 16px;
            color: #1c1c1e;
            direction: ltr;
        }
    </style>
</head>
<body>

    <header>
        <h1>المتجر الإلكتروني</h1>
    </header>

    <div class="container">
        <!-- منتج 1 -->
        <div class="card">
            <div>
                <div class="card-img"></div>
                <div class="card-title">المنتج الأول</div>
                <div class="card-price">$10.00</div>
            </div>
            <div id="paypal-container-1" class="paypal-box"></div>
        </div>

        <!-- منتج 2 -->
        <div class="card">
            <div>
                <div class="card-img"></div>
                <div class="card-title">المنتج الثاني</div>
                <div class="card-price">$20.00</div>
            </div>
            <div id="paypal-container-2" class="paypal-box"></div>
        </div>
    </div>

    <footer>
        <a href="https://wa.me/966560983152" target="_blank" class="whatsapp-btn">
            <span>تواصل واتساب</span>
            <strong>0560983152</strong>
        </a>
    </footer>

    <script>
        const paypalStyle = {
            layout: 'vertical',
            color: 'silver',
            shape: 'rect',
            label: 'paypal',
            height: 40
        };

        // إعداد أزرار الدفع للمنتج الأول
        paypal.Buttons({
            style: paypalStyle,
            createOrder: (data, actions) => {
                return actions.order.create({
                    purchase_units: [{ amount: { value: '10.00' } }]
                });
            },
            onApprove: (data, actions) => {
                return actions.order.capture().then(details => {
                    alert('تم الدفع بنجاح بواسطة ' + details.payer.name.given_name);
                });
            }
        }).render('#paypal-container-1');

        // إعداد أزرار الدفع للمنتج الثاني
        paypal.Buttons({
            style: paypalStyle,
            createOrder: (data, actions) => {
                return actions.order.create({
                    purchase_units: [{ amount: { value: '20.00' } }]
                });
            },
            onApprove: (data, actions) => {
                return actions.order.capture().then(details => {
                    alert('تم الدفع بنجاح بواسطة ' + details.payer.name.given_name);
                });
            }
        }).render('#paypal-container-2');
    </script>

</body>
</html>
